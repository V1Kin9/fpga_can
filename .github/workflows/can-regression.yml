name: CAN regression

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run CAN RTL regressions
        run: bash scripts/run_iverilog.sh
