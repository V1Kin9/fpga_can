name: CAN regression

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run CAN RTL regressions
        run: bash scripts/run_iverilog.sh
      - name: Run host FCAN decoder and SocketCAN bridge tests
        run: python -m unittest discover -s host -p 'test_*.py' -v
